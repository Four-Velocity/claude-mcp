# Fly.io configuration for the Claude OpenAI Image MCP server.
# Set the app name to your own before deploying (or run `fly launch`).
app = "claude-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  IMAGE_STORAGE_DIR = "/data/images"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# A single 2GB volume for generated images. Volumes pin the app to one
# machine on one host, which matches the single-machine setup requested here.
[[mounts]]
  source = "claude_mcp_images"
  destination = "/data/images"
  initial_size = "2gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
