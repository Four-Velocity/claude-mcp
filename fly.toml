# fly.toml app configuration file generated for claude-mcp on 2026-07-27T02:44:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'claude-mcp'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  IMAGE_STORAGE_DIR = '/data/images'
  PORT = '8080'

[[mounts]]
  source = 'claude_mcp_images'
  destination = '/data/images'
  initial_size = '2gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
