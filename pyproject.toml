[project]
name = "claude-mcp"
version = "0.1.0"
description = "MCP server exposing an OpenAI gpt-image-2 image-generation tool to Claude."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["claude_mcp"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ASYNC", # flake8-async
    "SIM",  # flake8-simplify
    "D",    # pydocstyle (enforce docstrings)
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
show_error_codes = true
files = ["claude_mcp"]
